name: Bina APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: navigator_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
      - run: flutter pub get
      - run: flutter build apk --release --dart-define="TOLL_QUOTE_URL=$TOLL_QUOTE_URL"
        env:
          TOLL_QUOTE_URL: ${{ vars.TOLL_QUOTE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: navigator-apk
          path: navigator_app/build/app/outputs/flutter-apk/app-release.apk
